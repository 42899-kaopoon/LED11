<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.6rem;
        }
        p.info-text {
            color: #95a5a6;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #webcam-container {
            margin: 1.5rem auto;
            border-radius: 50%;
            overflow: hidden;
            width: 200px;
            height: 200px;
            background-color: #f0f3f4;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #e2e8f0;
        }
        #webcam-container canvas {
            display: block;
        }
        #label-container {
            margin-top: 1.5rem;
            text-align: left;
        }
        .result-row {
            background-color: #f8fafc;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #2ecc71;
            font-size: 0.95rem;
        }
        .result-percentage {
            font-weight: 600;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Teachable Machine Image Model</h2>
    <p class="info-text">ระบบจะแสดงภาพสดและทำการวิเคราะห์ทายผลทุกๆ 5 วินาทีอัตโนมัติ</p>
    <button type="button" class="btn-primary" id="start-btn" onclick="init()">เปิดใช้งานกล้อง</button>
    <div id="webcam-container"></div>
    <div id="label-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/0b_vR0PQ5/";
    let model, webcam, labelContainer, maxPredictions;
    let predictInterval;

    async function init() {
        const startBtn = document.getElementById("start-btn");
        startBtn.disabled = true;
        startBtn.innerText = "กำลังเริ่มต้นระบบ...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        try {
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(200, 200, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; 
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "result-row";
                labelContainer.appendChild(row);
            }

            startBtn.innerText = "ระบบกำลังทำงาน";

            predictInterval = setInterval(async () => {
                await predict();
            }, 5000);

        } catch (error) {
            console.error(error);
            alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้ กรุณาตรวจสอบสิทธิ์การใช้กล้องถ่ายรูป");
            startBtn.disabled = false;
            startBtn.innerText = "เปิดใช้งานกล้อง";
        }
    }

    async function loop() {
        webcam.update();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            const probabilityPercent = (prediction[i].probability * 100).toFixed(0);
            labelContainer.childNodes[i].innerHTML = `
                <span class="result-name"><strong>${className}</strong></span>
                <span class="result-percentage">${probabilityPercent}%</span>
            `;
        }
    }
</script>

</body>
</html>
